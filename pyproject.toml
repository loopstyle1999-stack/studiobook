[project]
name = "studiobook"
version = "0.1.0"
description = "Self-hosted booking and membership management for small studios (yoga, pilates, dance, training)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["Flask>=3.0"]

[project.scripts]
studiobook = "studiobook.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studiobook*"]

[tool.setuptools.package-data]
studiobook = ["templates/*.html"]
