<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ studio_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<div class="login card">
  <div class="brand"><i></i>{{ studio_name }}</div>
  <p class="muted" style="margin-bottom:1rem">{{ t('login_title') }}</p>
  {% if disabled %}<div class="flash error">{{ t('admin_disabled') }}</div>
  {% elif error %}<div class="flash error">{{ t(error) }}</div>{% endif %}
  {% if not disabled %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{{ t('password') }}<input type="password" name="password" autofocus required></label>
    <button>{{ t('login_btn') }}</button>
  </form>
  {% endif %}
  <p class="muted" style="margin-top:1.2rem;text-align:center">{% include "_lang.html" %}</p>
</div>
</body>
</html>
