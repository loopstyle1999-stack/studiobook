<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>studiobook</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
  .card { border: 1px solid #ddd; border-radius: 10px; padding: 1rem; margin: .75rem 0; display: flex; justify-content: space-between; }
  .full { color: #b00; }
</style>
</head>
<body>
<h1>Classes</h1>
{% for c in classes %}
<div class="card">
  <div><strong>{{ c.title }}</strong><br>{{ c.starts_at }}</div>
  <div class="{{ 'full' if c.seats_left == 0 }}">{{ c.seats_left }} / {{ c.capacity }} seats left{% if c.seats_left == 0 and c.waitlist_size %}<br>{{ c.waitlist_size }} on waitlist{% endif %}</div>
</div>
{% else %}
<p>No classes yet. Add one with <code>POST /api/classes</code> (see README).</p>
{% endfor %}
</body>
</html>
