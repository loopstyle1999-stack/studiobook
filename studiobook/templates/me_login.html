{% extends "base_public.html" %}
{% block body %}
<div class="login card">
  <h1>{{ t('member_login') }}</h1>
  <p class="muted" style="margin:.3rem 0 1rem">{{ t('member_login_hint') }}</p>
  {% if error %}<div class="flash error">{{ t(error) }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{{ t('email') }}<input type="email" name="email" autocomplete="username" autofocus required></label>
    <label>{{ t('access_code_or_password') }}<input type="password" name="code" autocomplete="current-password" required></label>
    <button>{{ t('login_btn') }}</button>
  </form>
  <p class="muted" style="margin-top:1.2rem;text-align:center">{% include "_lang.html" %}</p>
</div>
{% endblock %}
