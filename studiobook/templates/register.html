{% extends "base_public.html" %}
{% block body %}
<div class="login card">
  <h1>{{ t('register_title') }}</h1>
  <p class="muted login-hint">{{ t('register_hint') }}</p>
  {% if error %}<div class="flash error">{{ t(error) }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>{{ t('name') }}<input name="name" autocomplete="name" required></label>
    <label>{{ t('email') }}<input type="email" name="email" autocomplete="username" required></label>
    <label>{{ t('password') }}<input type="password" name="password" autocomplete="new-password" minlength="6" required></label>
    <button>{{ t('register_btn') }}</button>
  </form>
  <p class="login-alt">{{ t('have_account') }} <a href="{{ url_for('login') }}">{{ t('login_btn') }}</a></p>
  <p class="muted login-foot">{% include "_lang.html" %}</p>
</div>
{% endblock %}
